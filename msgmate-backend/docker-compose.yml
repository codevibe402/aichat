services:
  postgres:
    image: postgres:16-alpine
    container_name: msgmate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: msgmate
    ports:
      - "5432:5432"
    volumes:
      - msgmate_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: msgmate-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - msgmate_redis:/data

volumes:
  msgmate_postgres:
  msgmate_redis:
